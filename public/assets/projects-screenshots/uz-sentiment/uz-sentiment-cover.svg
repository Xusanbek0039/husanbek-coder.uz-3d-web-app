<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Uz-Sentiment — o'zbekcha sharhlar tahlili</title>
  <desc id="desc">Uz-Sentiment loyihasi muqovasi: negative, neutral va positive sinflari hamda o'zbekcha sharh misollari.</desc>
  <defs>
    <radialGradient id="glow" cx="85%" cy="10%" r="60%">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="1" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#27272a" stroke-width="1" />
    </pattern>
    <style>
      .display { font-family: "Archivo Black", "Arial Black", sans-serif; }
      .sans { font-family: Rubik, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#09090b" />
  <rect width="1440" height="900" fill="url(#grid)" opacity="0.6" />
  <rect width="1440" height="900" fill="url(#glow)" />

  <!-- Teg -->
  <g transform="translate(120 92)">
    <rect width="268" height="44" rx="22" fill="#10b981" fill-opacity="0.12" stroke="#059669" stroke-opacity="0.6" />
    <circle cx="26" cy="22" r="6" fill="#10b981" />
    <text x="44" y="29" class="mono" font-size="20" fill="#6ee7b7">NLP · o'zbek tili</text>
  </g>

  <!-- Sarlavha -->
  <text x="116" y="238" class="display" font-size="112" fill="#fafafa">Uz-Sentiment</text>
  <text x="120" y="300" class="sans" font-size="40" fill="#a1a1aa">O'zbekcha sharhlar tahlili</text>

  <!-- 3 ta sinf -->
  <g transform="translate(120 346)">
    <rect x="0" width="392" height="14" rx="7" fill="#f43f5e" />
    <rect x="404" width="392" height="14" rx="7" fill="#a1a1aa" />
    <rect x="808" width="392" height="14" rx="7" fill="#10b981" />
    <text x="0" y="52" class="mono" font-size="22" fill="#fda4af">negative</text>
    <text x="404" y="52" class="mono" font-size="22" fill="#d4d4d8">neutral</text>
    <text x="808" y="52" class="mono" font-size="22" fill="#6ee7b7">positive</text>
  </g>

  <!-- Sharh misollari -->
  <g class="sans" font-size="36">
    <g transform="translate(120 450)">
      <rect width="1200" height="92" rx="14" fill="#18181b" stroke="#3f3f46" />
      <text x="36" y="58" fill="#f4f4f5">“Zo'r ekan, juda yoqdi!”</text>
      <text x="900" y="58" class="mono" font-size="28" fill="#71717a">→</text>
      <rect x="960" y="22" width="208" height="48" rx="24" fill="#10b981" fill-opacity="0.15" stroke="#10b981" />
      <text x="1064" y="55" class="mono" font-size="24" fill="#6ee7b7" text-anchor="middle">positive</text>
    </g>
    <g transform="translate(120 566)">
      <rect width="1200" height="92" rx="14" fill="#18181b" stroke="#3f3f46" />
      <text x="36" y="58" fill="#f4f4f5">“Siniq keldi, qadog'i ham yirtilgan”</text>
      <text x="900" y="58" class="mono" font-size="28" fill="#71717a">→</text>
      <rect x="960" y="22" width="208" height="48" rx="24" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" />
      <text x="1064" y="55" class="mono" font-size="24" fill="#fda4af" text-anchor="middle">negative</text>
    </g>
    <g transform="translate(120 682)">
      <rect width="1200" height="92" rx="14" fill="#18181b" stroke="#3f3f46" />
      <text x="36" y="58" fill="#f4f4f5">“O'rtacha, narxiga yarasha”</text>
      <text x="900" y="58" class="mono" font-size="28" fill="#71717a">→</text>
      <rect x="960" y="22" width="208" height="48" rx="24" fill="#a1a1aa" fill-opacity="0.15" stroke="#a1a1aa" />
      <text x="1064" y="55" class="mono" font-size="24" fill="#d4d4d8" text-anchor="middle">neutral</text>
    </g>
  </g>

  <!-- Pastki qator -->
  <text x="120" y="840" class="mono" font-size="22" fill="#71717a">~352K sharh · TF-IDF baseline · XLM-RoBERTa · FastAPI + React</text>
</svg>
